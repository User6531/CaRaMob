name: Telegram Notifications

on:
  push:
  pull_request:
    types: [opened, reopened, closed, ready_for_review]

concurrency:
  group: telegram-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram message (push)
        if: github.event_name == 'push' && github.event.head_commit != null
        env:
          MESSAGE: |
            🚀 New push!

            # Repository: ${{ github.repository }}
            Ref: ${{ github.ref_name }}
            Author: ${{ github.actor }}

            Commit:
            ${{ github.event.head_commit.message }}

            https://github.com/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          curl -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text="$MESSAGE"

      - name: Send Telegram message (pull request)
        if: >-
          github.event_name == 'pull_request' &&
          !(github.event.action == 'opened' && github.event.pull_request.draft)
        env:
          ACTION_LABEL: >-
            ${{
              github.event.action == 'closed' && github.event.pull_request.merged
                && '✅ merged'
              || github.event.action == 'closed' && '❌ closed'
              || github.event.action == 'ready_for_review' && '👀 ready for review'
              || github.event.action
            }}
          MESSAGE: |
            🔀 Pull request ${{ env.ACTION_LABEL }}!

            Repository: ${{ github.repository }}
            PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}
            ${{ github.event.pull_request.head.ref }} → ${{ github.event.pull_request.base.ref }}
            Author: ${{ github.actor }}

            ${{ github.event.pull_request.html_url }}
        run: |
          curl -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text="$MESSAGE"
